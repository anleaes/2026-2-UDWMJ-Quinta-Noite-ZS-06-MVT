{% extends 'base.html' %}
 
{% block title %}
 
    Adicionar Fase - {{ block.super }}
 
{% endblock title %}
 
{% block body %}
 
<br />
<b>Cadastro de Fase</b>
<br />
<br />
<form action="" method="POST">
{% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.name }}
    <br />
    <br />
    <label>Tipo</label>
    <br />
    {{ form.stage_type }}
    <br />
    <br />

    {{ form.order }}
    <br />
    <br />

    <br />
    {{ form.tournament }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>
 
{% endblock body %}
