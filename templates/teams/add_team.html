{% extends 'base.html' %}

{% block title %}

    Adicionar Time - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Adicionar Time</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.name }}
    <br />
    <br />
    <label>Sigla</label>
    <br />
    {{ form.tag }}
    <br />
    <br />
    <label>Data de criacao</label>
    <br />
    {{ form.created_at }}
    <br />
    <br />
    <label>Logo</label>
    <br />
    {{ form.logo }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
